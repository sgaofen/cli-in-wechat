name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Run unit tests
        # Invoke node directly under bash so the shell expands test/*.test.ts on every OS.
        # Going through `npm test` re-spawns via cmd.exe on Windows (no globbing), and
        # Node 20's --test (unlike Node 21+) can't glob itself -> "Could not find test/*.test.ts".
        shell: bash
        run: node --import tsx --test test/*.test.ts

      - name: Test module loading
        run: node -e "import('./dist/adapters/registry.js').then(m => { const r = new m.AdapterRegistry(); console.log('Registry OK, adapters:', r.getAll().map(a => a.name).join(', ')); })"

      - name: Test config module
        run: node -e "import('./dist/config.js').then(m => { m.ensureDataDir(); console.log('Config OK:', JSON.stringify(m.loadConfig())); })"

      - name: Test commandExists
        run: node -e "import('./dist/adapters/base.js').then(async m => { const ok = await m.commandExists('node'); console.log('commandExists(node):', ok); if (!ok) process.exit(1); })"

      - name: Test Windows shell flag
        shell: bash
        run: |
          node -e "
            import('./dist/adapters/base.js').then(m => {
              const isWin = process.platform === 'win32';
              console.log('platform:', process.platform, 'WIN:', m.WIN);
              if (isWin && !m.WIN) { console.error('FAIL: WIN must be true on Windows'); process.exit(1); }
              if (!isWin && m.WIN) { console.error('FAIL: WIN must be false on non-Windows'); process.exit(1); }
              console.log('PASS');
            })
          "

      - name: Test spawnProc on Windows
        if: runner.os == 'Windows'
        shell: bash
        run: |
          node --input-type=module -e "
            const m = await import('./dist/adapters/base.js');
            const proc = m.spawnProc('where', ['node'], { stdio: 'pipe' });
            let out = '';
            proc.stdout.on('data', c => { out += c; });
            proc.on('close', code => {
              console.log('where node:', out.trim().split('\n')[0]);
              if (code !== 0) { console.error('FAIL'); process.exit(1); }
              console.log('PASS');
            });
          "
